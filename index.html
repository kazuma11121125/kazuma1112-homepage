<!DOCTYPE html>
<html lang="jp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>503 - サービス終了 | kazuma1112</title>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="google-site-verification" content="YFyq-dZAMzhTXZVfmU5rekbSaE6sx24yxSCwFQqrcZc" />
    <!--==============レイアウトを制御する独自のCSSを読み込み===============-->
    <link rel="stylesheet" type="text/css" href="4-1-3.css" >
    <link rel="stylesheet" type="text/css" href="styles.css">
    <!--==============レイアウトを制御する独自のCSSを読み込み===============-->
    <link rel="stylesheet" type="text/css" href="reset.css">
    <link rel="stylesheet" type="text/css" href="slick.css">
    <link rel="stylesheet" type="text/css" href="6-1-7.css">
    <!--==============レイアウトを制御する独自のCSSを読み込み===============-->
    <link rel="stylesheet" type="text/css" href="5-7.css">

</head>

<body>
    <!--==============JQuery読み込み===============-->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js" integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo="
        crossorigin="anonymous"></script>
    <main>
        <div class="error-container">
            <div class="error-code">503</div>
            <div class="error-message">
                <h1>サービス終了のお知らせ</h1>
                <h2>Service Unavailable</h2>
                <p>申し訳ございませんが、kazuma1112のホームページはサービスを終了いたします。</p>
                <p>長らくのご利用、誠にありがとうございました。</p>
                <div class="error-details">
                    <p><strong>エラーコード:</strong> 503</p>
                    <p><strong>ステータス:</strong> サービス終了</p>
                    <p><strong>日付:</strong> <span id="current-date"></span></p>
                </div>
            </div>
        </div>
        
        <style>
            body {
                background: #1a1a1a;
                color: #ffffff;
                font-family: 'Arial', sans-serif;
                margin: 0;
                padding: 0;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .error-container {
                text-align: center;
                max-width: 600px;
                padding: 40px;
                background: #2a2a2a;
                border-radius: 10px;
                box-shadow: 0 8px 32px rgba(255, 0, 0, 0.3);
                border: 1px solid #ff4444;
            }
            
            .error-code {
                font-size: 120px;
                font-weight: bold;
                color: #ff4444;
                margin-bottom: 20px;
                text-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
            }
            
            .error-message h1 {
                color: #ff4444;
                margin-bottom: 10px;
                font-size: 32px;
            }
            
            .error-message h2 {
                color: #cccccc;
                margin-bottom: 30px;
                font-size: 20px;
                font-weight: normal;
            }
            
            .error-message p {
                color: #ffffff;
                margin-bottom: 20px;
                font-size: 18px;
                line-height: 1.6;
            }
            
            .error-details {
                margin-top: 40px;
                padding: 20px;
                background: #1a1a1a;
                border-radius: 5px;
                border-left: 4px solid #ff4444;
            }
            
            .error-details p {
                margin: 10px 0;
                font-size: 14px;
                color: #cccccc;
            }
            
            .error-details strong {
                color: #ffffff;
            }
        </style>
        
        <script>
            // Display current date
            document.addEventListener('DOMContentLoaded', function() {
                const currentDate = new Date().toLocaleDateString('ja-JP');
                document.getElementById('current-date').textContent = currentDate;
            });
        </script>
    </main>
    <footer style="position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a1a; text-align: center; padding: 10px; border-top: 1px solid #444;">
        <p style="color: #666; margin: 0;">&copy; 2023 kazuma1112 - サービス終了</p>
    </footer>
</body>
</html>
